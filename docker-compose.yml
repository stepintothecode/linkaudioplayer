services:
  player:
    build: .
    image: music-player:local
    container_name: music-player
    restart: unless-stopped

    # Bound to localhost only. Tailscale or Cloudflare Tunnel handles remote access,
    # so the port is never exposed to the LAN or the internet directly.
    ports:
      - "127.0.0.1:5080:5080"

    volumes:
      - player-data:/data

    environment:
      # Override to change where the database and cached audio live inside the volume.
      ConnectionStrings__Library: "Data Source=/data/library.db"
      MediaCache__Directory: "/data/media"

volumes:
  player-data:
